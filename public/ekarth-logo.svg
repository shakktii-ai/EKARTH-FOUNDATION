<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A47" />
      <stop offset="100%" stop-color="#162B1B" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Emblem: Tree of Learning & Nurturing -->
  <g transform="translate(6, 5)">
    <!-- Sun / Radiance of Hope -->
    <circle cx="28" cy="18" r="14" fill="url(#sunGrad)" opacity="0.9" />
    
    <!-- Tree Foliage / Supporting Hands -->
    <path d="M28 8 C20 8 13 14 13 22 C13 25 15 28 17 30 C12 32 8 38 8 44 C8 51 14 56 22 56 L34 56 C42 56 48 51 48 44 C48 38 44 32 39 30 C41 28 43 25 43 22 C43 14 36 8 28 8 Z" fill="url(#treeGrad)" opacity="0.95" />
    
    <!-- Child Reaching / Tree Trunk -->
    <circle cx="28" cy="31" r="3.5" fill="#FFFFFF" />
    <path d="M28 35 C25 35 23 37 23 40 L23 48 C23 49 24 50 25 50 L27 50 L27 57 L29 57 L29 50 L31 50 C32 50 33 49 33 48 L33 40 C33 37 31 35 28 35 Z" fill="#FFFFFF" />
    <path d="M23 40 C20 37 17 38 15 41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M33 40 C36 37 39 38 41 41" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(68, 12)">
    <text x="0" y="24" font-family="'Manrope', 'Outfit', sans-serif" font-weight="800" font-size="22" letter-spacing="1.5" fill="#162B1B">
      EKARTH
    </text>
    <text x="96" y="24" font-family="'Manrope', 'Outfit', sans-serif" font-weight="400" font-size="22" letter-spacing="1" fill="#2D7A47">
      FOUNDATION
    </text>
    <text x="1" y="40" font-family="'Manrope', sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.2" fill="#D97706">
      EMPOWER • EDUCATE • ELEVATE
    </text>
  </g>
</svg>
